name: Biome CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format-and-check:
    name: Format and Lint
    runs-on: ubuntu-latest
    # Required permission to push the formatted code back to the repository
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the actual PR branch so we can push to it
          ref: ${{ github.head_ref }}

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Format Code
        # This fixes all formatting issues automatically in the CI runner
        run: biome format --write .
        working-directory: src/epass-web

      - name: Commit formatting changes
        # Pushes the fixes back to your GitHub branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply Biome formatting"

      - name: Run Biome CI
        # Since formatting is already fixed, this will now only fail
        # if there are strict linting errors (not warnings)
        run: biome ci .
        working-directory: src/epass-web